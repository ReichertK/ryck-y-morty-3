<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/rick-and-morty-icon-png-images-29.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d1f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Imprenta interdimensional C-137: armá tu tarjeta de Rick & Morty, personalizá marcos y adornos, y descargá la imagen para regalar gratis."
    />

    <!-- Open Graph + Twitter para que las previews se vean lindas. -->
    <meta property="og:title" content="Imprenta C-137 · Tarjetas de Rick & Morty" />
    <meta property="og:description" content="Diseñá tu tarjeta del multiverso y descargala gratis. Sin login, sin watermarks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect a la API de Rick & Morty para acortar el TTFB de la primera request. -->
    <link rel="preconnect" href="https://rickandmortyapi.com" crossorigin />
    <link rel="dns-prefetch" href="https://rickandmortyapi.com" />

    <!-- Fuentes: serif moderna para titulares + sans para cuerpo + mono retro
         para sellos y detalles. display=swap evita la pantalla en blanco. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <title>Imprenta C-137 · Tarjetas interdimensionales</title>
  </head>
  <body class="bg-espacio text-papel antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
